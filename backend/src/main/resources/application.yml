server:
  port: 8080

spring:
  application:
    name: abms-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/abms
    username: abms
    password: abms_password
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
