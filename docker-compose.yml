services:
  postgres:
    image: postgres:17
    container_name: abms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: abms
      POSTGRES_USER: abms
      POSTGRES_PASSWORD: abms_password
    ports:
      - "5432:5432"
    volumes:
      - abms_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abms -d abms"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  abms_postgres_data:
